<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061522"><title>محادثة التذكرة | 7sabatk</title>
  <link rel="icon" type="image/webp" href="assets/images/7sabatk-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/commerce.css">
  <link rel="stylesheet" href="assets/css/marketplace-pro.css"><link rel="stylesheet" href="assets/css/branding.css">
  <link rel="stylesheet" href="assets/css/mobile-responsive.css"><link rel="stylesheet" href="assets/css/page-layouts.css"><link rel="stylesheet" href="assets/css/support.css">
<link rel="stylesheet" href="assets/css/support-notifications.css"></head>
<body data-page="support">
  <header class="site-header"><div class="container nav">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/images/7sabatk-logo.webp" alt="7sabatk"><span>موقع حساباتك</span></a>
    <nav class="nav-links" aria-label="التنقل الرئيسي">
      <a href="index.html" data-chat-copy="home">الرئيسية</a><a href="accounts.html" data-chat-copy="accounts">الحسابات</a>
      <a href="social-services.html" data-chat-copy="social">خدمات السوشيال ميديا</a><a href="subscriptions.html" data-chat-copy="subscriptions">الاشتراكات</a>
      <a class="support-nav-active" href="support.html" data-chat-copy="support">الدعم الفني</a>
    </nav>
  </div></header>
  <main class="section support-section support-chat-section"><div class="container">
    <div class="support-chat-back-row"><a class="support-secondary support-chat-back" href="support.html"><span aria-hidden="true">←</span><span data-chat-copy="back">العودة لمركز الدعم الفني</span></a><a class="support-secondary support-chat-back support-chat-inbox-back" id="chatStaffInboxBack" href="support-inbox.html" hidden><span aria-hidden="true">▤</span><span data-chat-copy="staffBack">العودة إلى صندوق الدعم الفني</span></a></div>
    <div class="section-heading support-heading"><span class="section-kicker" data-chat-copy="kicker">TICKET CONVERSATION</span><h1 data-chat-copy="title">محادثة الدعم</h1><p id="chatSubheading" data-chat-copy="loading">جارٍ تحميل التذكرة...</p></div>
    <section class="support-panel support-chat-panel" id="chatPanel" hidden>
      <div class="support-chat-top"><div><span class="support-ticket-number" id="chatTicketNumber"></span><h2 id="chatSubject"></h2></div><div class="support-chat-state"><span class="support-status" id="chatStatus"></span><span id="chatPriority" class="support-chat-priority"></span></div></div>
      <div class="support-agent-controls" id="staffControls" hidden>
        <label><span data-chat-copy="statusLabel">الحالة</span><select id="chatStatusSelect"><option value="open" data-chat-copy="open">مفتوحة</option><option value="in_progress" data-chat-copy="in_progress">قيد المعالجة</option><option value="waiting_customer" data-chat-copy="waiting_customer">بانتظار العميل</option><option value="resolved" data-chat-copy="resolved">تم الحل</option><option value="closed" data-chat-copy="closed">مغلقة</option></select></label>
        <label><span data-chat-copy="priorityLabel">الأولوية</span><select id="chatPrioritySelect"><option value="low" data-chat-copy="low">منخفضة</option><option value="normal" data-chat-copy="normal">عادية</option><option value="high" data-chat-copy="high">عالية</option><option value="urgent" data-chat-copy="urgent">عاجلة</option></select></label>
        <label><span data-chat-copy="assignLabel">إسناد لموظف</span><select id="chatAssignee"><option value="">بدون إسناد</option></select></label>
      </div>
      <div class="support-conversation" id="chatMessages" aria-live="polite"></div>
      <form class="support-chat-reply" id="chatReplyForm">
        <label class="support-internal-toggle" id="internalToggle" hidden><input type="checkbox" id="chatInternal"><span data-chat-copy="internal">ملاحظة داخلية (لا تظهر للعميل)</span></label>
        <label class="support-chat-message"><span data-chat-copy="replyLabel">اكتب ردك</span><textarea id="chatReply" rows="4" maxlength="10000" required></textarea></label>
        <div class="support-chat-reply-bottom"><label class="support-chat-upload"><span data-chat-copy="attach">إرفاق ملفات</span><input id="chatFiles" type="file" multiple accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"></label><span class="support-chat-file-hint" data-chat-copy="fileHint">JPG/PNG/PDF · حتى 5 ملفات · 5MB لكل ملف</span><button class="support-primary" id="chatSend" type="submit" data-chat-copy="send">إرسال الرد</button></div>
        <p id="chatMessageStatus" class="support-form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <div class="support-panel support-empty" id="chatError" hidden></div>
  </div></main>
  <footer><div class="container footer-inner"><a class="brand footer-brand" href="index.html"><img class="brand-logo" src="assets/images/7sabatk-logo.webp" alt="7sabatk"><span>موقع حساباتك</span></a><a href="support.html" data-chat-copy="back">العودة للدعم</a></div></footer>
  <script type="module" src="assets/js/support-conversation.js"></script>
<script type="module" src="assets/js/support-notifications.js"></script></body></html>
